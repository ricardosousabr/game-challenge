spring:
  application:
    name: Gamified Challenges API

  datasource:
    url: jdbc:h2:mem:gamechallengedb
    driver-class-name: org.h2.Driver
    username: sa
    password:

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      show-sql: true
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          format_sql: true

    api:
      security:
        token:
          secret: ${JWT_SECRET:my-secret-key}
